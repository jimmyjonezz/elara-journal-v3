name: LLM probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: openai SDK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cat > probe.mjs <<'EOF'
          import OpenAI from "openai";
          const c = new OpenAI({ apiKey: process.env.OPENROUTER_API_KEY, baseURL: "https://openrouter.ai/api/v1" });
          try {
            const r = await c.chat.completions.create({
              model: "meta-llama/llama-3.2-3b-instruct:free",
              messages: [{ role: "user", content: "ответь одним словом: жив" }], max_tokens: 5
            });
            console.log("OK SDK:", JSON.stringify(r.choices[0]?.message?.content));
          } catch (e) {
            console.log("FAIL SDK:", e.status, (e?.error?.message || e.message || "").slice(0, 200));
          }
          // сравнение: мусорный ключ — какой ответ на него?
          const bad = new OpenAI({ apiKey: "sk-or-invalid", baseURL: "https://openrouter.ai/api/v1" });
          try {
            await bad.chat.completions.create({ model: "meta-llama/llama-3.2-3b-instruct:free", messages: [{ role: "user", content: "x" }], max_tokens: 1 });
            console.log("BAD KEY: приняли?!");
          } catch (e) {
            console.log("BAD KEY FAIL:", e.status, (e?.error?.message || e.message || "").slice(0, 150));
          }
          EOF
          node probe.mjs
