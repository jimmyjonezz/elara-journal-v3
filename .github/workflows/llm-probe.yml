name: LLM probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe openrouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "=== ping (любая модель) ==="
          curl -s -o /tmp/ping -w "%{http_code}\n" -X POST https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer [REDACTED]" \
            -H "Content-Type: application/json" \
            -d '{"model":"meta-llama/llama-3.2-3b-instruct:free","messages":[{"role":"user","content":"ответь одним словом: жив"}],"max_tokens":5}' --max-time 60
          head -c 300 /tmp/ping; echo
          echo "=== ключ: валиден ли? (GET /key) ==="
          curl -s -m 30 https://openrouter.ai/api/v1/key -H "Authorization: Bearer [REDACTED]" | head -c 400; echo
          echo "=== free-модели (первые 12) ==="
          curl -s -m 40 https://openrouter.ai/api/v1/models -H "Authorization: Bearer [REDACTED]" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          free = [m['id'] for m in d['data'] if ':free' in m['id']]
          print('всего free:', len(free))
          for m in free[:12]: print(' ', m)
          "
