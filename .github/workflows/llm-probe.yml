name: LLM probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Debug env
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "len=${#OPENROUTER_API_KEY} prefix=${OPENROUTER_API_KEY:0:6}"
          echo "var set: ${OPENROUTER_API_KEY:+yes}"
          echo "=== chat ping с явной проверкой ==="
          curl -s -o /tmp/ping -w "HTTP:%{http_code}\n" -X POST https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer [REDACTED]" \
            -H "Content-Type: application/json" \
            -d '{"model":"meta-llama/llama-3.2-3b-instruct:free","messages":[{"role":"user","content":"жив?"}],"max_tokens":5}' --max-time 90
          head -c 400 /tmp/ping; echo
