name: LLM probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: quality check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cat > probe.mjs <<'EOF'
          import OpenAI from "openai";
          const c = new OpenAI({ apiKey: process.env.OPENROUTER_API_KEY, baseURL: "https://openrouter.ai/api/v1" });
          const prompt = `Напиши короткий дневниковый_entry (3-4 предложения) от лица женщины-писательницы: зимняя прогулка, конкретная бытовая деталь, без клише. Только текст.`;
          const cands = ["inclusionai/ling-3.2-flash:free", "nvidia/nemotron-3.5-lightning:free",
                         "baidu/ernie-5.5-flash-preview:free", "recursive/flint-v1.0:free"];
          for (const m of cands) {
            try {
              const r = await c.chat.completions.create({ model: m, messages: [{ role: "user", content: prompt }], max_tokens: 300 });
              const txt = r.choices[0]?.message?.content || "(пусто)";
              console.log(`\n=== ${m} (usage: ${JSON.stringify(r.usage)}) ===\n${txt.slice(0, 500)}`);
            } catch (e) {
              console.log(`\n=== ${m} FAIL: ${e.status} ${(e?.error?.message || e.message || "").slice(0, 150)}`);
            }
          }
          EOF
          node probe.mjs
