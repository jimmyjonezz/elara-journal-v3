name: LLM probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Debug env
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.error
          key = os.environ["OPENROUTER_API_KEY"]
          def call(url, headers, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.status, r.read()[:600].decode(errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:600].decode(errors="replace")
              except Exception as e:
                  return None, str(e)
          # доходит ли Authorization headers до сервера вообще?
          print("httpbin:", call("https://httpbin.org/get", {"Authorization": f"Bearer [REDACTED]"}))
          EOF
