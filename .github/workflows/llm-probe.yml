name: LLM probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Debug env
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.error
          key = os.environ["OPENROUTER_API_KEY"]
          def call(url, headers, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.status, r.read()[:400].decode(errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:400].decode(errors="replace")
              except Exception as e:
                  return None, str(e)
          # 1. GET /key
          print("/key:", call("https://openrouter.ai/api/v1/key", {"Authorization": f"Bearer [REDACTED]"}))
          # 2. chat через SDK-стиль заголовков
          h = {"Authorization": f"Bearer [REDACTED]", "Content-Type": "application/json",
               "HTTP-Referer": "https://elara-journal", "X-Title": "elara-probe"}
          body = {"model": "meta-llama/llama-3.2-3b-instruct:free",
                  "messages": [{"role": "user", "content": "ответь одним словом: жив"}], "max_tokens": 5}
          print("chat:", call("https://openrouter.ai/api/v1/chat/completions", h, body))
          # 3. chat домен api.openrouter.ai
          print("chat alt host:", call("https://api.openrouter.ai/api/v1/chat/completions", h, body))
          EOF
