name: LLM probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ollama models
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          for m in gemma4:31b-cloud kimi-k3 gpt-oss:20b deepseek-v4.1-flash minimax-m3.1-flash glm-5.3-flash; do
            code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST https://ollama.com/v1/chat/completions \
              -H "Authorization: Bearer [REDACTED]" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"жив?\"}],\"max_tokens\":3}" --max-time 40)
            echo "$m -> $code"
          done
