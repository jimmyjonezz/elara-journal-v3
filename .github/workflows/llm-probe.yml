name: LLM probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: free models chat
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cat > probe.mjs <<'EOF'
          import OpenAI from "openai";
          const c = new OpenAI({ apiKey: process.env.OPENROUTER_API_KEY, baseURL: "https://openrouter.ai/api/v1" });
          const list = await c.models.list();
          const free = list.data.filter(m => m.id.endsWith(":free")).map(m => m.id);
          console.log("free models:", free.length);
          for (const m of free) {
            try {
              const r = await c.chat.completions.create({
                model: m, messages: [{ role: "user", content: "ответь одним словом: жив" }], max_tokens: 5
              });
              console.log("OK  ", m, "->", JSON.stringify(r.choices[0]?.message?.content || "").slice(0, 40));
            } catch (e) {
              console.log("FAIL", m, ":", e.status, (e?.error?.message || e.message || "").slice(0, 90));
            }
          }
          EOF
          node probe.mjs
