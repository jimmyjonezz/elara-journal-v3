name: LLM probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Probe opencode models via openai SDK
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          cat > probe.mjs <<'EOF'
          import OpenAI from "openai";
          const c = new OpenAI({ apiKey: process.env.OPENCODE_API_KEY, baseURL: "https://opencode.ai/zen/v1" });
          try {
            const list = await c.models.list();
            for (const m of list.data) console.log("MODEL:", m.id);
          } catch (e) { console.log("LIST FAIL:", e.status, e?.error?.message || e.message); }
          const cands = ["ling-3.0-flash", "ling-4.0-flash", "zen-1-mini", "ling-3.0-flash-fin-free",
                         "gpt-oss:20b", "kimi-k3", "gemma4:31b", "glm-5.3-flash", "deepseek-v4.1-flash",
                         "minimax-m3.1-flash", "qwen3-coder", "llama-3.3-70b"];
          for (const m of cands) {
            try {
              const r = await c.chat.completions.create({ model: m, messages: [{ role: "user", content: "жив?" }] });
              console.log(`OK ${m}:`, JSON.stringify(r.choices[0]?.message?.content || "").slice(0, 80));
            } catch (e) {
              console.log(`FAIL ${m}:`, e.status, (e?.error?.message || e.message || "").slice(0, 120));
            }
          }
          EOF
          node probe.mjs
