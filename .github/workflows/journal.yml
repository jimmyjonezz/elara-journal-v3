name: Elara Journal

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Stage tests
        run: npm run test:stage

      - name: Precalc seasonal embeddings
        # Идемпотентно: хеш пулов не изменился → 0 запросов к Voyage.
        # Изменённые пулы → пересчёт, файл коммитится вместе с data/*.json.
        run: npx ts-node scripts/precalc-seasonal-embeddings.ts
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

      - name: Run journal
        run: npx ts-node main.ts
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "jimmyjonezz"
          git config user.email "jimmy@elara.ai"
          git add data/*.json
          git commit -m "Update journal entries" || echo "No changes"
          git push
