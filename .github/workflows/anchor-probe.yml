name: Anchor sentence-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Sentence-level anchor probe
        run: npx ts-node scripts/probe-sentence-anchor.ts
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
